<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Dashboard v10</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#161616;color:#f2f2f2}
/* ===== сайдбар ===== */
#side{position:fixed;left:0;top:0;bottom:0;width:112px;background:#0c0c0c;display:flex;flex-direction:column;gap:6px;padding:18px 10px;z-index:10;border-right:1px solid #232323}
.sb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:none;background:transparent;color:#8a8a8a;font:inherit;font-size:11px;border-radius:16px;cursor:pointer;transition:.15s}
.sb .ic{font-size:20px}
.sb:hover{background:#1c1c1c;color:#fff}
.sb.on{background:#ff6b1a;color:#fff;box-shadow:0 6px 18px rgba(255,107,26,.35)}
.ver{margin-top:auto;color:#ff6b1a;border:1.5px solid #ff6b1a;border-radius:999px;padding:6px 4px;font-size:11px;text-align:center;cursor:pointer;font-weight:600}
.ver:hover{background:rgba(255,107,26,.15)}
/* ===== основная область ===== */
#main{margin-left:112px;padding:26px 28px;max-width:1150px;min-height:100vh}
h1{font-size:26px;font-weight:800;margin-bottom:14px;color:#fff;letter-spacing:-.3px}
h1::after{content:'';display:block;width:46px;height:4px;border-radius:2px;background:#ff6b1a;margin-top:8px}
.small{font-size:13px;color:#8a8a8a}
/* ===== карточки ===== */
.card{background:#1d1d1f;border:1px solid #2b2b2e;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:#1d1d1f;border:1px solid #2b2b2e;border-radius:20px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#ff6b1a}
.kpi .lbl{font-size:13px;color:#8a8a8a}
.kpi .val{font-size:24px;font-weight:800;margin-top:4px;color:#fff;letter-spacing:-.5px}
.kpi .sub{font-size:12px;color:#6f6f6f;margin-top:2px}
/* ===== вкладки и кнопки ===== */
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.tab{padding:7px 16px;border-radius:999px;border:1px solid #2b2b2e;background:#1d1d1f;color:#c9c9c9;cursor:pointer;font-size:14px;transition:.15s}
.tab:hover{border-color:#ff6b1a;color:#fff}
.tab.on{background:#ff6b1a;color:#fff;border-color:transparent;font-weight:600}
.btn{background:#ff6b1a;color:#fff;border:none;padding:9px 18px;border-radius:999px;cursor:pointer;font-size:14px;margin:4px 6px 4px 0;font-weight:600;transition:.15s}
.btn:hover{background:#ff8139}
.btn.gray{background:#333;box-shadow:none}.btn.gray:hover{background:#444}
.btn.red{background:#e03636;box-shadow:none}
.del{color:#ff6b6b;border:none;background:none;cursor:pointer;font-size:15px}
/* ===== таблицы ===== */
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{border-bottom:2px solid #2b2b2e;padding:8px;text-align:left;font-size:12px;color:#8a8a8a;text-transform:uppercase;letter-spacing:.4px}
.t td{border-bottom:1px solid #262626;padding:6px 8px;vertical-align:middle}
.t tr:hover td{background:#232325}
.cell{width:100%;border:none;background:transparent;color:#f2f2f2;font:inherit;padding:4px 6px;border-radius:8px}
.cell:focus{background:#262626;outline:1px solid #ff6b1a}
.num{text-align:right}.r{text-align:right}
/* ===== проекты ===== */
.mrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.mname{font-size:20px;font-weight:800;min-width:130px}
.hgrid{display:flex;flex-wrap:wrap;gap:6px}
.hd{width:34px;height:34px;border-radius:12px;border:2px solid #2b2b2e;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;user-select:none;background:#1d1d1f;color:#e7e7e7;transition:.12s}
.hd:hover{border-color:#ff6b1a}
.hhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.grow{display:flex;align-items:center;height:32px;border-bottom:1px solid #262626}
.glabel{width:150px;font-size:13px;flex-shrink:0;padding-right:8px}
.gtrack{position:relative;flex:1;height:14px;background:#262628;border-radius:7px}
.gbar{position:absolute;top:0;height:14px;border-radius:7px;background:linear-gradient(90deg,#ff6b1a,#ff9a4d)}
.ghdr{display:flex;margin-left:150px;font-size:11px;color:#8a8a8a}
.ghdr span{flex:1;text-align:center}
/* ===== ошибка ===== */
#err{position:fixed;left:112px;right:0;bottom:0;background:#e03636;color:#fff;padding:8px 14px;font-size:13px;display:none;z-index:99}
/* ===== формы ===== */
input.f,select.f{padding:8px 12px;border:1px solid #2b2b2e;border-radius:12px;font:inherit;background:#1d1d1f;color:#f2f2f2}
input.f::placeholder{color:#5d5d5d}
select.f option{background:#1d1d1f}
.frow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input[type=checkbox].chk{width:16px;height:16px;cursor:pointer;accent-color:#ff6b1a}
input[type=range]{accent-color:#ff6b1a}
input[type=date],input[type=month]{color-scheme:dark}
canvas{max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:middle}
@media(max-width:700px){#side{width:56px}.sb .lbl{display:none}#main{margin-left:56px}#err{left:56px}}
</style>
</head>
<body>
<div id="side">
<button class="sb on" data-p="home" onclick="go('home')"><span class="ic">🏠</span><span class="lbl">Главная</span></button>
<button class="sb" data-p="work" onclick="go('work')"><span class="ic">💼</span><span class="lbl">Работа</span></button>
<button class="sb" data-p="biz" onclick="go('biz')"><span class="ic">📈</span><span class="lbl">Бизнес</span></button>
<button class="sb" data-p="pers" onclick="go('pers')"><span class="ic">🏡</span><span class="lbl">Личное</span></button>
<button class="sb" data-p="fin" onclick="go('fin')"><span class="ic">💰</span><span class="lbl">Финансы</span></button>
<button class="sb" data-p="hab" onclick="go('hab')"><span class="ic">✅</span><span class="lbl">Привычки</span></button>
<div class="ver" onclick="resetAll()" title="Сбросить все данные и загрузить заново">v10 ⟳</div>
</div>
<div id="main">
<div id="pg-home" class="page"></div>
<div id="pg-work" class="page" style="display:none"></div>
<div id="pg-biz" class="page" style="display:none"></div>
<div id="pg-pers" class="page" style="display:none"></div>
<div id="pg-fin" class="page" style="display:none"></div>
<div id="pg-hab" class="page" style="display:none"></div>
<div id="err"></div>
</div>
<script>
/* ===== помощники ===== */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const fmt=n=>(Math.round((n||0)*100)/100).toLocaleString('ru-RU');
const sum=(a,f)=>a.reduce((s,x)=>s+((f?f(x):x)||0),0);
function isoOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
window.addEventListener('error',e=>{const el=$('#err');if(el){el.style.display='block';el.textContent='Ошибка: '+(e.message||e.type)+' — пришлите этот текст Алисе';}});
function errShow(ctx,e){const el=$('#err');if(el){el.style.display='block';el.textContent='Ошибка ('+ctx+'): '+(e&&e.message?e.message:e);}}
let _eid=0,_tid=0;
function nextId(){return 'e'+(++_eid)+'_'+Math.floor(Math.random()*9999);}
function nextTid(){return 't'+(++_tid)+'_'+Math.floor(Math.random()*9999);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
/* ===== данные по умолчанию ===== */
function mkRow(name,plan,fact){return{name:name||'',plan:plan||0,fact:fact||0};}
function mkMonth(name){
 return {name:name,
  income:[mkRow('Зарплата',80000,0),mkRow('Фриланс',10000,0)],
  expFix:[mkRow('Аренда',20000,0),mkRow('Кредиты',0,0),mkRow('Связь',1000,0)],
  expVar:[mkRow('Продукты',20000,0),mkRow('Транспорт',3000,0),mkRow('Кафе',5000,0)],
  sav:[mkRow('Подушка',10000,0)],
  credits:[
   {name:'Т-кредитка',pay:30000,paid:0,debtStart:69493},
   {name:'Пример банка',pay:5000,paid:0,debtStart:120000}
  ]};
}
function defaults(){
 return {
  sec:{work:'proj',biz:'proj',pers:'proj'},
  finTab:'ov',finM:2,habM:null,
  projects:{
   work:[{name:'Отчёт за квартал',prog:40,start:'2026-10',end:'2026-12'}],
   biz:[{name:'Продажи',prog:20,start:'2026-09',end:'2026-12'}],
   pers:[{name:'Ремонт',prog:60,start:'2026-08',end:'2026-11'}]
  },
  tasks:{
   work:[{id:nextTid(),name:'Созвон с командой',done:false,due:'2026-11-10',pr:'Высокий',proj:'Отчёт за квартал'},{id:nextTid(),name:'Подготовить отчёт',done:false,due:'',pr:'Средний',proj:'Отчёт за квартал'}],
   biz:[{id:nextTid(),name:'Обновить прайс',done:false,due:'',pr:'Средний',proj:'Продажи'}],
   pers:[{id:nextTid(),name:'Записаться к врачу',done:false,due:'',pr:'Высокий',proj:'Ремонт'}]
  },
  months:[mkMonth('Сентябрь'),mkMonth('Октябрь'),mkMonth('Ноябрь')],
  expenses:[],habits:[
   {id:1,name:'Зарядка',color:'#ff6b1a',marks:{}},
   {id:2,name:'Чтение 15 минут',color:'#10b981',marks:{}},
   {id:3,name:'Без сахара',color:'#e03636',marks:{}}
  ]
 };
}
/* ===== хранение и ремонт ===== */
const KEY='aliceDashV10';
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.months)S=defaults();
function repair(){
 ['work','biz','pers'].forEach(p=>{
  if(!S.projects)S.projects={};
  if(!Array.isArray(S.projects[p]))S.projects[p]=[];
  if(!S.tasks)S.tasks={};
  if(!Array.isArray(S.tasks[p]))S.tasks[p]=[];
  if(!S.sec)S.sec={};
  if(['proj','task','gantt'].indexOf(S.sec[p])<0)S.sec[p]='proj';
  S.tasks[p].forEach(x=>{x.id=x.id||nextTid();x.done=!!x.done;x.due=x.due||'';x.pr=x.pr||'Средний';x.proj=x.proj||'';});
 });
 if(!Array.isArray(S.months)||!S.months.length)S.months=defaults().months;
 S.months.forEach(m=>{['income','expFix','expVar','sav'].forEach(k=>{if(!Array.isArray(m[k]))m[k]=[]});if(!Array.isArray(m.credits))m.credits=[];});
 if(!Array.isArray(S.expenses))S.expenses=[];
 if(!Array.isArray(S.habits))S.habits=[];
 S.expenses.forEach(x=>{x.id=x.id||nextId();x.sum=+x.sum||0;});
 S.habits.forEach(x=>{x.id=x.id||Date.now();x.marks=x.marks||{};});
 if(S.finTab==null)S.finTab='ov';
 if(S.finM==null||!S.months[S.finM])S.finM=S.months.length-1;
 if(!S.habM||!/^\d{4}-\d{2}$/.test(S.habM))S.habM=isoOf(new Date()).slice(0,7);
}
repair();
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
function resetAll(){
 if(confirm('Сбросить все данные дашборда? Введённые вами суммы и проекты заменятся на примеры.')){
  localStorage.removeItem(KEY);
  location.reload();
 }
}
/* ===== навигация ===== */
function go(p){
 $$('.sb').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
 $$('.page').forEach(x=>x.style.display='none');
 $('#pg-'+p).style.display='block';
 render(p);
}
function render(p){
 try{
  if(p==='home')rHome();
  else if(p==='fin')finRender();
  else if(p==='hab')habRender();
  else rSection(p);
 }catch(e){errShow('страница '+p,e);}
}
/* ===== главная ===== */
function monthFact(m,key){return sum(m[key],r=>r.fact);}
function rHome(){
 const m=S.months[S.finM];
 const inc=monthFact(m,'income'),exp=monthFact(m,'expFix')+monthFact(m,'expVar');
 const allT=['work','biz','pers'].reduce((n,p)=>n+S.tasks[p].filter(t=>!t.done).length,0);
 let h='<h1>Главная</h1><div class="cards">';
 h+='<div class="kpi"><div class="lbl">Деньги ('+esc(m.name)+')</div><div class="val">'+fmt(inc-exp)+' ₽</div><div class="sub">доход − расход</div></div>';
 h+='<div class="kpi"><div class="lbl">Доходы</div><div class="val">'+fmt(inc)+' ₽</div></div>';
 h+='<div class="kpi"><div class="lbl">Расходы</div><div class="val">'+fmt(exp)+' ₽</div></div>';
 h+='<div class="kpi"><div class="lbl">Незавершённых задач</div><div class="val">'+allT+'</div></div></div>';
 h+='<div class="card"><b>Привычки сегодня</b><div id="habToday" style="margin-top:10px"></div></div>';
 $('#pg-home').innerHTML=h;
 const box=$('#habToday');
 if(!S.habits.length)box.innerHTML='<span class="small">Пока нет привычек — добавьте во вкладке ✅</span>';
 else{
  const t=isoOf(new Date());
  box.innerHTML=S.habits.map(x=>{
   const on=!!x.marks[t];
   return '<button class="btn" style="background:'+(on?x.color:'#333')+';box-shadow:none" onclick="toggleHab('+x.id+')">'+(on?'✓ ':'○ ')+esc(x.name)+'</button>';
  }).join(' ');
 }
}
function toggleHab(id){
 const h=S.habits.find(x=>x.id===id);if(!h)return;
 const t=isoOf(new Date());
 if(h.marks[t])delete h.marks[t];else h.marks[t]=true;
 save();
 if($('#pg-home').style.display!=='none')rHome();
 if($('#pg-hab').style.display!=='none')habRender();
}
/* ===== разделы: проекты и задачи по проектам ===== */
const SECT={work:'Работа',biz:'Бизнес',pers:'Личное'};
function rSection(p){
 let h='<h1>'+SECT[p]+'</h1>';
 h+='<div class="small">проектов: '+S.projects[p].length+' · задач: '+S.tasks[p].length+'</div>';
 h+='<div class="tabs">';
 ['proj','task','gantt'].forEach(t=>{h+='<button class="tab'+(S.sec[p]===t?' on':'')+'" onclick="sub(\''+p+'\',\''+t+'\')">'+({proj:'Проекты',task:'Задачи',gantt:'Гант'})[t]+'</button>';});
 h+='</div><div id="sec-'+p+'-body"></div>';
 $('#pg-'+p).innerHTML=h;
 try{secBody(p);}catch(e){errShow('раздел '+SECT[p],e);}
}
function sub(p,t){S.sec[p]=t;save();rSection(p);}
function secBody(p){
 const t=S.sec[p],box=$('#sec-'+p+'-body');
 if(t==='proj'){
  let h='<div class="card"><table class="t"><tr><th>Проект</th><th style="width:130px">Начало</th><th style="width:130px">Конец</th><th style="width:200px">Прогресс</th><th class="r" style="width:30px"></th></tr>';
  S.projects[p].forEach((x,i)=>{
   h+='<tr><td><input class="cell" value="'+esc(x.name)+'" oninput="projName(\''+p+'\','+i+',this.value)"></td>';
   h+='<td><input class="cell" type="month" value="'+(x.start||'')+'" onchange="projDate(\''+p+'\','+i+',\'start\',this.value)"></td>';
   h+='<td><input class="cell" type="month" value="'+(x.end||'')+'" onchange="projDate(\''+p+'\','+i+',\'end\',this.value)"></td>';
   h+='<td><input type="range" min="0" max="100" value="'+(x.prog||0)+'" style="width:70%" onchange="projProg(\''+p+'\','+i+',this.value)"><span class="small"> '+(x.prog||0)+'%</span></td>';
   h+='<td class="r"><button class="del" onclick="delProj(\''+p+'\','+i+')">✕</button></td></tr>';
  });
  if(!S.projects[p].length)h+='<tr><td colspan="5" class="small">Проектов пока нет — добавьте первый кнопкой ниже.</td></tr>';
  h+='</table><button class="btn" onclick="addProj(\''+p+'\')">+ добавить проект</button></div>';
  box.innerHTML=h;
 }else if(t==='task'){
  const prj=S.projects[p];
  let h='<div class="card"><b>Новая задача</b><div class="frow">';
  h+='<select class="f" id="tk-'+p+'-prj" style="min-width:170px">'+(prj.length?prj.map(x=>'<option>'+esc(x.name)+'</option>').join(''):'<option value="">— нет проектов —</option>')+'</select>';
  h+='<input class="f" id="tk-'+p+'-name" placeholder="Название задачи" style="flex:1;min-width:160px">';
  h+='<input class="f" type="date" id="tk-'+p+'-due">';
  h+='<select class="f" id="tk-'+p+'-pr">'+['Высокий','Средний','Низкий'].map(o=>'<option>'+o+'</option>').join('')+'</select>';
  h+='<button class="btn" onclick="addTaskTo(\''+p+'\')">+ задача</button></div>';
  if(!prj.length)h+='<div class="small" style="margin-top:8px">Сначала добавьте проект на вкладке «Проекты» — задача привяжется к нему.</div>';
  h+='</div>';
  const groups={},order=[];
  S.tasks[p].forEach(x=>{
   const g=(x.proj&&prj.some(q=>q.name===x.proj))?x.proj:'Без проекта';
   if(!groups[g]){groups[g]=[];order.push(g);}
   groups[g].push(x);
  });
  const sorted=[];prj.forEach(q=>{if(groups[q.name]!==undefined)sorted.push(q.name);});
  if(groups['Без проекта'])sorted.push('Без проекта');
  sorted.forEach(g=>{
   const list=groups[g],act=list.filter(x=>!x.done).length;
   h+='<div class="card"><b>'+esc(g)+'</b> <span class="small">— активных: '+act+' из '+list.length+'</span>';
   if(list.length){
    h+='<table class="t" style="margin-top:8px"><tr><th style="width:30px"></th><th>Задача</th><th style="width:140px">Срок</th><th style="width:110px">Приоритет</th><th class="r" style="width:30px"></th></tr>';
    list.forEach(x=>{
     h+='<tr><td><input type="checkbox" class="chk" '+(x.done?'checked':'')+' onchange="taskToggle(\''+p+'\',\''+x.id+'\',this.checked)"></td>';
     h+='<td style="'+(x.done?'text-decoration:line-through;color:#6f6f6f':'')+'"><input class="cell" value="'+esc(x.name)+'" oninput="taskName(\''+p+'\',\''+x.id+'\',this.value)"></td>';
     h+='<td><input class="cell" type="date" value="'+(x.due||'')+'" onchange="taskDue(\''+p+'\',\''+x.id+'\',this.value)"></td>';
     h+='<td><select class="f" style="width:100%" onchange="taskPr(\''+p+'\',\''+x.id+'\',this.value)">'+['Высокий','Средний','Низкий'].map(o=>'<option '+(x.pr===o?'selected':'')+'>'+o+'</option>').join('')+'</select></td>';
     h+='<td class="r"><button class="del" onclick="delTask(\''+p+'\',\''+x.id+'\')">✕</button></td></tr>';
    });
    h+='</table>';
   }else h+='<div class="small" style="margin-top:8px">Задач пока нет — добавьте через форму выше.</div>';
   h+='</div>';
  });
  box.innerHTML=h;
 }else{
  const pr=S.projects[p].filter(x=>x.start&&x.end);
  let h='<div class="card"><b>Гант — '+SECT[p]+'</b> <button class="btn" onclick="addProj(\''+p+'\')">+ добавить проект</button>';
  if(!S.projects[p].length)h+='<div class="small" style="margin-top:8px">Проектов пока нет — добавьте первый кнопкой выше.</div>';
  else if(!pr.length)h+='<div class="small" style="margin-top:8px">Укажите проектам даты начала и конца на вкладке «Проекты» — диаграмма построится сама. Ваши проекты: '+S.projects[p].map(x=>esc(x.name)).join(', ')+'</div>';
  else{
   const lo=Math.min.apply(null,pr.map(x=>monthIdx(x.start)));
   const hi=Math.max.apply(null,pr.map(x=>monthIdx(x.end)));
   const span=hi-lo+1;
   h+='<div class="ghdr">'+Array.from({length:span},(_,i)=>'<span>'+MONTHS[(lo+i)%12]+'</span>').join('')+'</div>';
   pr.forEach(x=>{
    const a=monthIdx(x.start)-lo,b=monthIdx(x.end)-lo;
    const L=a/span*100,W=(b-a+1)/span*100;
    h+='<div class="grow"><div class="glabel">'+esc(x.name)+'</div><div class="gtrack"><div class="gbar" style="left:'+L+'%;width:'+W+'%"></div></div></div>';
   });
  }
  h+='</div>';
  box.innerHTML=h;
 }
}
function projName(p,i,v){S.projects[p][i].name=v;save();}
function projDate(p,i,f,v){S.projects[p][i][f]=v;save();if(S.sec[p]==='gantt')secBody(p);}
function projProg(p,i,v){S.projects[p][i].prog=+v;save();secBody(p);}
function addProj(p){
 if(!Array.isArray(S.projects[p]))S.projects[p]=[];
 S.projects[p].push({name:'Новый проект',prog:0,start:'',end:''});
 save();secBody(p);
}
function delProj(p,i){
 S.projects[p].splice(i,1);
 S.tasks[p].forEach(x=>{if(x.proj&&!S.projects[p].some(q=>q.name===x.proj))x.proj='';});
 save();secBody(p);
}
function findTask(p,id){return S.tasks[p].find(x=>x.id===id);}
function taskToggle(p,id,v){const x=findTask(p,id);if(x){x.done=v;save();secBody(p);}}
function taskName(p,id,v){const x=findTask(p,id);if(x){x.name=v;save();}}
function taskDue(p,id,v){const x=findTask(p,id);if(x){x.due=v;save();}}
function taskPr(p,id,v){const x=findTask(p,id);if(x){x.pr=v;save();}}
function delTask(p,id){S.tasks[p]=S.tasks[p].filter(x=>x.id!==id);save();secBody(p);}
function addTaskTo(p){
 if(!Array.isArray(S.tasks[p]))S.tasks[p]=[];
 const prjName=$('#tk-'+p+'-prj')?$('#tk-'+p+'-prj').value:'';
 const n=$('#tk-'+p+'-name')?$('#tk-'+p+'-name').value.trim():'';
 if(!n)return;
 S.tasks[p].push({id:nextTid(),name:n,done:false,due:$('#tk-'+p+'-due')?$('#tk-'+p+'-due').value:'',pr:$('#tk-'+p+'-pr')?$('#tk-'+p+'-pr').value:'Средний',proj:prjName||''});
 save();secBody(p);

function monthIdx(ym){const a=ym.split('-').map(Number);return a[0]*12+a[1]-1;}
function ymFromIdx(i){return Math.floor(i/12)+'-'+String(i%12+1).padStart(2,'0');}
/* ===== финансы ===== */
function finRender(){
 const m=S.months[S.finM];
 let h='<h1>Финансы</h1>';
 h+='<div class="mrow"><button class="btn gray" onclick="mvMonth(-1)">‹</button><span class="mname">'+esc(m.name)+'</span><button class="btn gray" onclick="mvMonth(1)">›</button>';
 h+='<select class="f" onchange="pickMonth(this.value)">'+S.months.map((x,i)=>'<option value="'+i+'" '+(i===S.finM?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>';
 h+='<button class="btn" onclick="addMonth()">+ месяц (с переносом)</button><button class="btn red" onclick="delMonth()">Удалить месяц</button></div>';
 h+='<div class="tabs">'+[['ov','Обзор'],['cr','Кредиты и долги'],['ex','Ежедневные траты'],['ch','Графики']].map(t=>'<button class="tab'+(S.finTab===t[0]?' on':'')+'" onclick="finSub(\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</div>';
 h+='<div id="fin-body"></div>';
 $('#pg-fin').innerHTML=h;
 try{finBody();}catch(e){errShow('финансы',e);}
}
function mvMonth(d){S.finM=Math.max(0,Math.min(S.months.length-1,S.finM+d));save();finRender();}
function pickMonth(i){S.finM=+i;save();finRender();}
function finSub(t){S.finTab=t;save();finRender();}
function finBody(){
 const m=S.months[S.finM],box=$('#fin-body');
 if(S.finTab==='ov')finOv(m,box);
 else if(S.finTab==='cr')finCr(m,box);
 else if(S.finTab==='ex')finEx(m,box);
 else finCh(m,box);
}
function kpi(lbl,val,sub2){return '<div class="kpi"><div class="lbl">'+lbl+'</div><div class="val">'+fmt(val)+' ₽</div>'+(sub2?'<div class="sub">'+sub2+'</div>':'')+'</div>';}
function finOv(m,box){
 const inc=monthFact(m,'income'),fix=monthFact(m,'expFix'),vr=monthFact(m,'expVar'),sav=monthFact(m,'sav');
 const pInc=sum(m.income,r=>r.plan),pExp=sum(m.expFix,r=>r.plan)+sum(m.expVar,r=>r.plan),pSav=sum(m.sav,r=>r.plan);
 let h='<div class="cards">';
 h+=kpi('Деньги',inc-fix-vr,'доход − расход');
 h+=kpi('Доходы',inc,'план '+fmt(pInc)+' ₽');
 h+=kpi('Расходы',fix+vr,'план '+fmt(pExp)+' ₽');
 h+=kpi('Сбережения',sav,'план '+fmt(pSav)+' ₽');
 h+='</div>';
 h+=tableHTML(m,S.finM,'income','Доходы');
 h+=tableHTML(m,S.finM,'expFix','Обязательные расходы');
 h+=tableHTML(m,S.finM,'expVar','Переменные расходы');
 h+=tableHTML(m,S.finM,'sav','Сбережения');
 box.innerHTML=h;
}
function tableHTML(m,mi,key,title){
 const rows=m[key];
 let h='<div class="card"><b>'+title+'</b><table class="t"><tr><th>Название</th><th class="r" style="width:110px">План</th><th class="r" style="width:110px">Факт</th><th class="r" style="width:110px">Разница</th><th class="r" style="width:30px"></th></tr>';
 rows.forEach((r,i)=>{
  h+='<tr><td><input class="cell" value="'+esc(r.name)+'" oninput="setCell('+mi+',\''+key+'\','+i+',\'name\',this.value)"></td>';
  ['plan','fact'].forEach(f=>{h+='<td><input class="cell num" value="'+(r[f]||0)+'" onchange="setCellNum('+mi+',\''+key+'\','+i+',\''+f+'\',this.value)"></td>';});
  h+='<td class="num" style="color:'+(((r.fact||0)-(r.plan||0))>=0?'#4ade80':'#ff6b6b')+'">'+fmt((r.fact||0)-(r.plan||0))+'</td>';
  h+='<td class="r"><button class="del" onclick="delRow('+mi+',\''+key+'\','+i+')">✕</button></td></tr>';
 });
 h+='<tr style="font-weight:700"><td>Итого</td><td class="num">'+fmt(sum(rows,r=>r.plan))+'</td><td class="num">'+fmt(sum(rows,r=>r.fact))+'</td><td class="num">'+fmt(sum(rows,r=>(r.fact||0)-(r.plan||0)))+'</td><td></td></tr>';
 h+='</table><button class="btn" onclick="addRow('+mi+',\''+key+'\')">+ добавить строку</button></div>';
 return h;
}
function setCell(mi,key,i,f,v){S.months[mi][key][i][f]=v;save();}
function setCellNum(mi,key,i,f,v){S.months[mi][key][i][f]=parseFloat(String(v).replace(',','.'))||0;save();finBody();}
function addRow(mi,key){S.months[mi][key].push(mkRow('',0,0));save();finBody();}
function delRow(mi,key,i){S.months[mi][key].splice(i,1);save();finBody();}
function finCr(m,box){
 let h='<div class="card"><b>Кредиты и долги</b><table class="t"><tr><th>Банк</th><th class="r" style="width:100px">Платёж</th><th class="r" style="width:100px">Оплачено</th><th class="r" style="width:120px">Долг на начало</th><th class="r" style="width:110px">Остаток</th><th class="r" style="width:30px"></th></tr>';
 m.credits.forEach((c,i)=>{
  const rest=Math.max(0,(c.debtStart||0)-(c.paid||0));
  h+='<tr><td><input class="cell" value="'+esc(c.name)+'" oninput="setCr('+S.finM+','+i+',\'name\',this.value)"></td>';
  h+='<td><input class="cell num" value="'+(c.pay||0)+'" onchange="setCrNum('+S.finM+','+i+',\'pay\',this.value)"></td>';
  h+='<td><input class="cell num" value="'+(c.paid||0)+'" onchange="setCrNum('+S.finM+','+i+',\'paid\',this.value)"></td>';
  h+='<td><input class="cell num" value="'+(c.debtStart||0)+'" onchange="setCrNum('+S.finM+','+i+',\'debtStart\',this.value)"></td>';
  h+='<td class="num"><b>'+fmt(rest)+'</b></td>';
  h+='<td class="r"><button class="del" onclick="delCr('+S.finM+','+i+')">✕</button></td></tr>';
 });
 const tot=f=>sum(m.credits,c=>c[f]||0);
 h+='<tr style="font-weight:700"><td>Итого</td><td class="num">'+fmt(tot('pay'))+'</td><td class="num">'+fmt(tot('paid'))+'</td><td class="num">'+fmt(tot('debtStart'))+'</td><td class="num">'+fmt(sum(m.credits,c=>Math.max(0,(c.debtStart||0)-(c.paid||0))))+'</td><td></td></tr>';
 h+='</table><button class="btn" onclick="addCr('+S.finM+')">+ добавить кредит</button><div class="small" style="margin-top:8px">Остаток = долг на начало − оплачено. При переносе месяца остаток становится новым долгом.</div></div>';
 box.innerHTML=h;
}
function setCr(mi,i,f,v){S.months[mi].credits[i][f]=v;save();}
function setCrNum(mi,i,f,v){S.months[mi].credits[i][f]=parseFloat(String(v).replace(',','.'))||0;save();finBody();}
function addCr(mi){S.months[mi].credits.push({name:'Новый банк',pay:0,paid:0,debtStart:0});save();finBody();}
function delCr(mi,i){S.months[mi].credits.splice(i,1);save();finBody();}
function addMonth(){
 const nm=prompt('Название нового месяца:','Новый месяц');if(nm==null)return;
 const m=JSON.parse(JSON.stringify(S.months[S.months.length-1]));
 m.name=nm||'Новый месяц';
 m.credits.forEach(c=>{c.debtStart=Math.max(0,(c.debtStart||0)-(c.paid||0));c.paid=0;});
 ['income','expFix','expVar','sav'].forEach(k=>m[k].forEach(r=>r.fact=0));
 S.months.push(m);S.finM=S.months.length-1;save();finRender();
}
function delMonth(){
 if(S.months.length<=1)return;
 if(!confirm('Удалить месяц «'+S.months[S.finM].name+'»?'))return;
 S.months.splice(S.finM,1);S.finM=Math.min(S.finM,S.months.length-1);save();finRender();
}
const CATS=['Еда','Продукты','Транспорт','Кафе','Хозяйство','Здоровье','Прочее'];
function finEx(m,box){
 const mi=MONTHS.indexOf(m.name),yr=new Date().getFullYear();
 const list=mi>=0?S.expenses.filter(x=>x.d&&x.d.slice(5,7)===String(mi+1).padStart(2,'0')&&x.d.slice(0,4)===String(yr)).sort((a,b)=>a.d<b.d?-1:1):[];
 let h='<div class="card"><b>Добавить трату</b><div class="frow">';
 h+='<input class="f" type="date" id="ex-d" value="'+isoOf(new Date())+'">';
 h+='<input class="f" type="number" id="ex-s" placeholder="Сумма" style="width:110px">';
 h+='<input class="f" list="catl" id="ex-c" placeholder="Категория" style="width:140px">';
 h+='<datalist id="catl">'+CATS.map(c=>'<option>'+c+'</option>').join('')+'</datalist>';
 h+='<input class="f" id="ex-n" placeholder="Комментарий" style="flex:1;min-width:160px">';
 h+='<button class="btn" onclick="addExp()">Добавить</button></div></div>';
 h+='<div class="card"><b>Траты за '+esc(m.name.toLowerCase())+'</b> <span class="small">— всего '+fmt(sum(list,x=>x.sum))+' ₽</span>';
 if(!list.length)h+='<div class="small" style="margin-top:8px">Трат пока нет.</div>';
 else{
  h+='<table class="t" style="margin-top:8px"><tr><th style="width:110px">Дата</th><th class="r" style="width:100px">Сумма</th><th style="width:120px">Категория</th><th>Комментарий</th><th class="r" style="width:30px"></th></tr>';
  list.forEach(x=>{
   const gi=S.expenses.indexOf(x);
   h+='<tr><td>'+esc(x.d)+'</td><td class="num">'+fmt(x.sum)+' ₽</td><td>'+esc(x.cat||'')+'</td><td><input class="cell" value="'+esc(x.note||'')+'" oninput="S.expenses['+gi+'].note=this.value;save()"></td><td class="r"><button class="del" onclick="delExp('+gi+')">✕</button></td></tr>';
  });
  h+='</table>';
 }
 h+='</div>';
 box.innerHTML=h;
}
function addExp(){
 const d=$('#ex-d')?$('#ex-d').value:'';
 const s=parseFloat(String($('#ex-s')?$('#ex-s').value:'').replace(',','.'))||0;
 if(!d||!s)return;
 S.expenses.push({id:nextId(),d:d,sum:s,cat:$('#ex-c')?$('#ex-c').value:'',note:$('#ex-n')?$('#ex-n').value:''});
 save();finBody();
}
function delExp(i){S.expenses.splice(i,1);save();finBody();}
/* ===== графики ===== */
const PIE_COLORS=['#ff6b1a','#ff9a4d','#10b981','#3b82f6','#a855f7','#e03636','#eab308','#14b8a6'];
function finCh(m,box){
 let h='<div class="card"><b>Баланс по месяцам (доход − расход)</b><canvas id="chBars" width="900" height="280"></canvas></div>';
 h+='<div class="card"><b>Траты по категориям — '+esc(m.name)+'</b><canvas id="chPie" width="900" height="300"></canvas></div>';
 box.innerHTML=h;
 drawBars();
 drawPie(m);
}
function drawBars(){
 const c=$('#chBars');if(!c)return;
 const ctx=c.getContext('2d');
 ctx.clearRect(0,0,c.width,c.height);
 const data=S.months.map(mm=>monthFact(mm,'income')-monthFact(mm,'expFix')-monthFact(mm,'expVar'));
 const mx=Math.max.apply(null,data.map(x=>Math.abs(x)).concat([1]));
 const W=c.width,H=c.height,pad=40,bw=(W-pad*2)/data.length*0.55;
 ctx.strokeStyle='#2b2b2e';ctx.beginPath();ctx.moveTo(pad,H/2);ctx.lineTo(W-pad,H/2);ctx.stroke();
 data.forEach((v,i)=>{
  const x=pad+(W-pad*2)*(i+0.22)/data.length;
  const bh=Math.abs(v)/mx*(H/2-pad);
  ctx.fillStyle=v>=0?'#10b981':'#e03636';
  if(v>=0)ctx.fillRect(x,H/2-bh,bw,bh);else ctx.fillRect(x,H/2,bw,bh);
  ctx.fillStyle='#8a8a8a';ctx.font='12px Arial';ctx.textAlign='center';
  ctx.fillText(S.months[i].name,x+bw/2,H-10);
  ctx.fillText(fmt(v),x+bw/2,v>=0?H/2-bh-6:H/2+bh+14);
 });
}
function drawPie(m){
 const c=$('#chPie');if(!c)return;
 const ctx=c.getContext('2d');
 ctx.clearRect(0,0,c.width,c.height);
 const byCat={};
 S.expenses.forEach(x=>{
  const mi=MONTHS.indexOf(m.name);
  if(mi>=0&&x.d&&x.d.slice(5,7)===String(mi+1).padStart(2,'0')&&x.d.slice(0,4)===String(new Date().getFullYear())){
   const k=x.cat||'Прочее';byCat[k]=(byCat[k]||0)+x.sum;
  }
 });
 const items=Object.keys(byCat).map(k=>({k:k,v:byCat[k]})).sort((a,b)=>b.v-a.v);
 if(!items.length){ctx.fillStyle='#8a8a8a';ctx.font='14px Arial';ctx.fillText('Трат за месяц пока нет',40,150);return;}
 const tot=sum(items,x=>x.v),cx=180,cy=150,r=110;
 let a0=-Math.PI/2;
 items.forEach((x,i)=>{
  const a1=a0+x.v/tot*2*Math.PI;
  ctx.fillStyle=PIE_COLORS[i%PIE_COLORS.length];
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a0,a1);ctx.closePath();ctx.fill();
  a0=a1;
 });
 ctx.font='13px Arial';ctx.textAlign='left';
 items.forEach((x,i)=>{
  const yy=60+i*28;
  ctx.fillStyle=PIE_COLORS[i%PIE_COLORS.length];ctx.fillRect(380,yy-10,14,14);
  ctx.fillStyle='#f2f2f2';ctx.fillText(x.k+' — '+fmt(x.v)+' ₽ ('+Math.round(x.v/tot*100)+'%)',404,yy+2);
 });
}
/* ===== привычки ===== */
function habRender(){
 const ym=S.habM,parts=ym.split('-').map(Number);
 const days=new Date(parts[0],parts[1],0).getDate();
 const mn=MONTHS[parts[1]-1]||ym;
 let h='<h1>Привычки</h1>';
 h+='<div class="mrow"><button class="btn gray" onclick="mvHabM(-1)">‹</button><span class="mname">'+esc(mn)+' '+parts[0]+'</span><button class="btn gray" onclick="mvHabM(1)">›</button></div>';
 h+='<div class="card"><b>Новая привычка</b><div class="frow">';
 h+='<input class="f" id="hb-name" placeholder="Название" style="flex:1;min-width:180px">';
 h+='<button class="btn" onclick="addHab()">+ добавить привычку</button></div></div>';
 if(!S.habits.length)h+='<div class="card"><span class="small">Привычек пока нет — добавьте первую выше.</span></div>';
 S.habits.forEach((x,hi)=>{
  let cnt=0,cells='';
  for(let d=1;d<=days;d++){
   const t=ym+'-'+String(d).padStart(2,'0');
   const on=!!x.marks[t];
   if(on)cnt++;
   cells+='<div class="hd'+(on?'':' ')+'" style="'+(on?'background:'+x.color+';border-color:'+x.color:'')+'" onclick="habToggle('+hi+',\''+t+'\')">'+d+'</div>';
  }
  h+='<div class="card hrow"><div class="hhead"><span class="dot" style="background:'+x.color+'"></span><b>'+esc(x.name)+'</b>';
  h+='<span class="small">отмечено дней: '+cnt+'</span><span class="small">серия: '+streak(x)+' 🔥</span>';
  h+='<button class="del" style="margin-left:auto" onclick="delHab('+hi+')">✕ удалить</button></div>';
  h+='<div class="hgrid">'+cells+'</div></div>';
 });
 $('#pg-hab').innerHTML=h;
}
function mvHabM(d){
 let ym=S.habM.split('-').map(Number);
 let m=ym[1]-1+d,y=ym[0];
 if(m<0){m=11;y--;}if(m>11){m=0;y++;}
 S.habM=y+'-'+String(m+1).padStart(2,'0');save();habRender();
}
function streak(x){
 const d=new Date();let n=0;
 for(let i=0;i<400;i++){
  const t=isoOf(d);
  if(x.marks[t]){n++;d.setDate(d.getDate()-1);}else break;
 }
 return n;
}
function habToggle(hi,t){
 const x=S.habits[hi];if(!x)return;
 if(x.marks[t])delete x.marks[t];else x.marks[t]=true;
 save();habRender();
}
function addHab(){
 const n=$('#hb-name')?$('#hb-name').value.trim():'';
 if(!n)return;
 const colors=['#ff6b1a','#10b981','#e03636','#3b82f6','#a855f7','#eab308'];
 S.habits.push({id:Date.now(),name:n,color:colors[S.habits.length%colors.length],marks:{}});
 save();habRender();
}
function delHab(hi){
 if(!confirm('Удалить привычку?'))return;
 S.habits.splice(hi,1);save();habRender();
}
/* ===== запуск ===== */
go('home');
</script>
